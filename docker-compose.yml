services:
  db:
    image: postgres:16-alpine
    container_name: dsa_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsa_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dsa_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsa_user} -d ${POSTGRES_DB:-dsa_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
